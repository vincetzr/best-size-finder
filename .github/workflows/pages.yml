# Publish the page, and switch GitHub Pages on if it is not already.
#
# `enablement: true` is the point of this file. Pages is otherwise a setting
# somebody has to find and flip, and the whole reason this repository exists is
# that a camera needs an origin — so the fewer manual steps between a commit and
# a working https URL, the better.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued one supersedes a running one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
